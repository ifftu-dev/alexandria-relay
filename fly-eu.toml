# Fly.io configuration for Alexandria relay node (EU)
app = "alexandria-relay-eu"
primary_region = "fra"  # Frankfurt — Europe

[mounts]
  source = "relay_data"
  destination = "/data"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_DATA_DIR = "/data"
  RUST_LOG = "info"

# TCP port for libp2p
[[services]]
  internal_port = 4001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 4001
    handlers = []

# UDP port for QUIC
[[services]]
  internal_port = 4001
  protocol = "udp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 4001
    handlers = []

# HTTP port for health checks and metrics.
#
# `/health` is public so Fly's healthcheck (and any external uptime monitor)
# keeps working. `/peers`, `/metrics` and `/health/alerts` require the
# RELAY_ADMIN_TOKEN bearer token and answer 404 without it — this listener is
# on the public internet, so operational data has to be asked for explicitly.
#
# Port 443 with the `tls` handler so nothing on this listener is plaintext.
# Port 9090 is kept for the platform healthcheck only.
[[services]]
  internal_port = 9090
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 9090
    handlers = ["http"]

[checks]
  [checks.health]
    port = 9090
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  # 1 GB — same headroom rationale as fly.toml.
  memory = "1024mb"
  cpus = 1
